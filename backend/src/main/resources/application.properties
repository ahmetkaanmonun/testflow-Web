# Server
server.port=8080

# Veritabanı (H2, dosya modu)
# Geliştirme/pilot: H2 DOSYA modunda — veriler backend/data/ altında kalıcı,
# yeniden başlatmada silinmez. AUTO_SERVER: H2 konsolu uygulama çalışırken de bağlanabilir.
# Kalıcı sunucu (PostgreSQL/MSSQL) gelince bu blok ortam değişkenleriyle değiştirilecek.
spring.datasource.url=jdbc:h2:file:./data/testflowdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update: tablolar korunur, yeni alanlar eklenir (create-drop her başlatmada her şeyi siliyordu).
# Not: sütun silme/yeniden adlandırmayı yapmaz — canlıda Flyway migration kullanılacak.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Konsol yalnız localhost'tan erişilebilir (web-allow-others varsayılanı false).
# Sunucuya kurulumda mutlaka kapatılmalı.
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
spring.h2.console.path=/h2-console

# Mock embedded LDAP (UnboundID)
spring.ldap.embedded.ldif=classpath:mock-ldap.ldif
spring.ldap.embedded.base-dn=dc=testflow,dc=com
spring.ldap.embedded.port=8389

# LDAP bağlantı (embedded'e işaret ediyor — gerçek AD'ye geçince burası değişir)
spring.ldap.urls=ldap://localhost:8389
spring.ldap.base=dc=testflow,dc=com
spring.ldap.username=cn=admin,dc=testflow,dc=com
spring.ldap.password=admin

# JWT
app.jwt.secret=demo-jwt-secret-testflow-web-gizli-256bit-anahtar!
app.jwt.expiration-ms=604800000

# CORS (React dev server)
app.cors.allowed-origins=http://localhost:5173

# Loglama
logging.level.com.testflow=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.ldap=WARN
