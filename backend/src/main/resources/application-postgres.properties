# =============================================================================
# PostgreSQL profili (sunucu)
#
# Etkinleştirme : SPRING_PROFILES_ACTIVE=postgres   (veya --spring.profiles.active=postgres)
# Şema         : db/postgresql/ altındaki script'lerle önceden oluşturulur.
#
# Bağlantı bilgileri bu dosyaya YAZILMAZ; sunucuda ortam değişkeni olarak verilir:
#   DB_URL       örn. jdbc:postgresql://localhost:5432/testflow
#   DB_USERNAME  örn. testflow_app
#   DB_PASSWORD  (gizli)
# =============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=testflow
# validate: uygulama şemayı DEĞİŞTİRMEZ, yalnız entity'lerle uyumunu kontrol eder;
# uyumsuzlukta açılmaz. Şema değişiklikleri script/Flyway ile yapılır.
spring.jpa.hibernate.ddl-auto=validate

# H2 konsolu sunucuda kapalı
spring.h2.console.enabled=false
